<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo List - Stay Organized</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1 class="title">Todo List</h1>
            <p class="subtitle">Stay organized and productive</p>
        </header>

        <main class="main">
            <form class="add-todo-form" id="addTodoForm">
                <input 
                    type="text" 
                    id="todoInput" 
                    class="todo-input" 
                    placeholder="What needs to be done?"
                    maxlength="250"
                    required
                >
                <button type="submit" class="add-btn">
                    <span class="add-icon">+</span>
                    Add Task
                </button>
            </form>

            <div class="todo-controls">
                <div class="filter-buttons">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="active">Active</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>
                <div class="todo-stats">
                    <span id="todoCount">0 tasks remaining</span>
                </div>
            </div>

            <ul class="todo-list" id="todoList">
                <!-- Todos will be dynamically inserted here -->
            </ul>

            <div class="empty-state" id="emptyState">
                <div class="empty-icon">📝</div>
                <h3>No tasks yet</h3>
                <p>Add a task above to get started</p>
            </div>

            <div class="bulk-actions" id="bulkActions">
                <button class="bulk-btn" id="clearCompleted">Clear Completed</button>
                <button class="bulk-btn danger" id="clearAll">Clear All</button>
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
